services:
  # 1. Combined API and Worker Web Service
  - type: web
    name: intervu-backend-combined
    env: node
    region: singapore # Closest Render region to Supabase in AWS Mumbai (~30ms latency)
    plan: starter # Dedicated CPU, no sleep/cold starts
    buildCommand: npm install && npx turbo run build --filter=@intervu-ai/api --filter=@intervu-ai/worker
    startCommand: node scripts/start-combined.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Supabase Transaction Pooler (port 6543 with ?pgbouncer=true)
      - key: DIRECT_URL
        sync: false # Supabase Direct Connection (port 5432) for Prisma migrations
      - key: REDIS_URL
        fromService:
          type: redis
          name: intervu-redis
          property: connectionString
      - key: NODE_OPTIONS
        value: --max-old-space-size=1536 # 1.5GB heap to prevent blocking GC pauses
      - key: WORKER_CONCURRENCY
        value: 2
      - key: ENABLE_GENERATION_QUEUE
        value: true
      - key: ENABLE_EVALUATION_QUEUE
        value: true
      - key: ENABLE_ANALYTICS_QUEUE
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # 2. Next.js Frontend Web Service
  - type: web
    name: intervu-web
    env: node
    region: singapore # Closest region to users in India/Asia
    plan: starter
    buildCommand: npm install && npx turbo run build --filter=@intervu-ai/web
    startCommand: npm run start --workspace @intervu-ai/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: intervu-backend-combined
          property: url

# 3. Managed Redis
redis:
  - name: intervu-redis
    region: singapore
    plan: starter # Persistent instance (does not expire)
    ipAllowList: [] # empty IP allowlist permits connection from other services within Render account
