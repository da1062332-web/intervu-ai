# Judge0 1.13.1 configuration, mounted at /judge0.conf in server and workers.
# Only names Judge0 actually reads belong here (see the upstream judge0.conf
# for v1.13.1); unknown names are silently ignored.
#
# Concurrency is deliberately NOT pinned, so it follows the instance size
# after a resize:
#   RAILS_SERVER_PROCESSES  default 2      web server processes
#   RAILS_MAX_THREADS       default nproc  threads per web process
#   COUNT                   default 2*nproc  worker processes running code
# Submissions created with wait=true run inside a web thread
# (processes x threads at once); without wait they run in the workers.

# Max submissions waiting in the queue before Judge0 rejects new ones (503)
MAX_QUEUE_SIZE=2000

# Time limits (seconds)
CPU_TIME_LIMIT=5.0
MAX_CPU_TIME_LIMIT=15.0
CPU_EXTRA_TIME=1.0
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false

# Memory limits (KB)
MEMORY_LIMIT=512000
MAX_MEMORY_LIMIT=2048000

# Stack limits (KB)
STACK_LIMIT=128000
MAX_STACK_LIMIT=256000

# Process limits (the JVM needs many threads)
MAX_PROCESSES_AND_OR_THREADS=120
MAX_MAX_PROCESSES_AND_OR_THREADS=240

# File size limit (KB)
MAX_FILE_SIZE=4096
NUMBER_OF_RUNS=1

# Lets the API delete finished submissions (DELETE /submissions/:token, sent
# with X-Auth-User = AUTHZ_TOKEN). Judge0 defaults to false and answers 400
# "delete not allowed", so every submission's code and test data would stay
# in Postgres forever.
ENABLE_SUBMISSION_DELETE=true
