# Judge0 Configuration for High Concurrency (2,000 Students)
# Number of parallel isolate worker processes (scaled to 20 workers)
N_WORKERS=20

# Max queue size in Redis before rejecting
MAX_QUEUE_SIZE=2000

# Submissions limits
CPU_TIME_LIMIT=5.0
MAX_CPU_TIME_LIMIT=15.0
CPU_EXTRA_TIME=1.0
ENABLE_PER_PROCESS_CPU_TIME_LIMIT=false

# Memory limits (bytes)
MEMORY_LIMIT=512000
MAX_MEMORY_LIMIT=2048000
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false

# Stack limits (KB)
STACK_LIMIT=128000
MAX_STACK_LIMIT=256000

# Process limits
MAX_PROCESSES_AND_OR_THREADS=120
MAX_MAX_PROCESSES_AND_OR_THREADS=240

# File size limits (KB)
MAX_FILE_SIZE=4096
NUMBER_OF_RUNS=1
