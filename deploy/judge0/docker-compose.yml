version: '3.8'

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - '2358:2358'
    privileged: true
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=db
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0_secure_password
      - POSTGRES_DB=judge0
    depends_on:
      - db
      - redis

  workers:
    image: judge0/judge0:1.13.1
    command: ['./scripts/workers']
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=db
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0_secure_password
      - POSTGRES_DB=judge0
    depends_on:
      - db
      - redis

  db:
    image: postgres:13.0
    restart: always
    environment:
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0_secure_password
      - POSTGRES_DB=judge0
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:6.0
    restart: always
    command: [
      "bash", "-c",
      "docker-entrypoint.sh --appendonly no --requirepass '' --maxmemory 1024mb --maxmemory-policy allkeys-lru"
    ]
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
