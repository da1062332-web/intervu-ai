version: "3.9"

services:
  postgres:
    image: postgres:16

    container_name: intervu-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intervu_ai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7

    container_name: intervu-redis

    restart: always

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/api.Dockerfile

    container_name: intervu-api

    restart: always

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - ../../.env

    ports:
      - "4000:4000"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    environment:
      NODE_ENV: production
      REDIS_URL: "redis://redis:6379"

  worker:
    build:
      context: ../../
      dockerfile: infrastructure/docker/worker.Dockerfile

    container_name: intervu-worker

    restart: always

    depends_on:
      redis:
        condition: service_healthy

    env_file:
      - ../../.env

    environment:
      NODE_ENV: production
      REDIS_URL: "redis://redis:6379"
      ENABLE_GENERATION_QUEUE: "true"
      ENABLE_EVALUATION_QUEUE: "true"
      ENABLE_ANALYTICS_QUEUE: "true"
      WORKER_CONCURRENCY: "5"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const Redis = require('ioredis'); const r = new Redis(process.env.REDIS_URL); r.ping().then(() => { r.disconnect(); process.exit(0); }).catch(() => process.exit(1));",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  judge0-server:
    image: judge0/judge0:latest
    container_name: judge0-server
    volumes:
      - ./judge0/judge0-master/judge0.conf:/judge0.conf:ro
      - ./judge0/judge0-master/db/languages/active.rb:/api/db/languages/active.rb:ro
      - ./judge0/judge0-master/db/languages/archived.rb:/api/db/languages/archived.rb:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "2358:2358"
    privileged: true
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  judge0-worker:
    image: judge0/judge0:latest
    container_name: judge0-worker
    command: ["./scripts/workers"]
    volumes:
      - ./judge0/judge0-master/judge0.conf:/judge0.conf:ro
      - ./judge0/judge0-master/db/languages/active.rb:/api/db/languages/active.rb:ro
      - ./judge0/judge0-master/db/languages/archived.rb:/api/db/languages/archived.rb:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
